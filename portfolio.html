  <style>
    :root {
      --black: #111111;
      --gray-900: #1d1d1d;
      --gray-600: #6b6b6b;
      --gray-400: #9a9a9a;
      --gray-200: #e5e5e5;
      --gray-100: #f4f4f4;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--white);
      color: var(--black);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Centered layout ---------- */
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 620px;
      margin: 0 auto;
      padding: 40px 28px;
    }

    /* ---------- Circular photo ---------- */
    .photo {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--gray-100);
      margin-bottom: 28px;
      border: 1px solid var(--gray-200);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* placeholder look when no image */
    .photo .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-400);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: repeating-linear-gradient(45deg, var(--gray-100), var(--gray-100) 10px, #eeeeee 10px, #eeeeee 20px);
    }

    /* ---------- Content ---------- */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray-600);
      margin-bottom: 20px;
    }

    .eyebrow .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    h1 {
      font-size: clamp(38px, 5.5vw, 60px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .role {
      font-size: 17px;
      font-weight: 500;
      color: var(--gray-900);
      margin-bottom: 20px;
    }

    .desc {
      font-size: 15px;
      line-height: 1.65;
      color: var(--gray-600);
      max-width: 440px;
      margin: 0 auto 30px;
    }

    /* ---------- Contact ---------- */
    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 28px;
      margin-bottom: 30px;
    }

    .contact a {
      font-size: 14px;
      color: var(--gray-900);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s ease;
    }

    .contact a:hover {
      color: var(--black);
    }

    .contact a svg {
      width: 15px;
      height: 15px;
      stroke: var(--gray-400);
    }

    .contact a:hover svg {
      stroke: var(--black);
    }

    /* ---------- Actions ---------- */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--black);
      color: var(--white);
      font-size: 15px;
      font-weight: 500;
      padding: 15px 26px;
      border-radius: 40px;
      text-decoration: none;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: var(--gray-900);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      transition: transform 0.25s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    .btn-ghost {
      font-size: 14px;
      color: var(--gray-600);
      text-decoration: none;
      border-bottom: 1px solid var(--gray-200);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .btn-ghost:hover {
      color: var(--black);
      border-color: var(--black);
    }

    /* ---------- Socials ---------- */
    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--gray-200);
      color: var(--gray-600);
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .socials a:hover {
      color: var(--black);
      border-color: var(--black);
      transform: translateY(-2px);
    }

    .socials a svg {
      width: 18px;
      height: 18px;
    }

    /* footer sig */
    .sig {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--gray-400);
      letter-spacing: 0.1em;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 600px) {
      body {
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      .actions {
        flex-direction: column;
        gap: 14px;
      }
    }
  </style>
</head>
